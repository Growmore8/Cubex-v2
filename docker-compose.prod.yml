# CubeX V2 — full production stack for a Hostinger VPS (Docker + Caddy).
# Copy .env.production.example -> .env, fill it in, then:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy handles ALL TLS via on-demand certificates: it issues a Let's Encrypt cert
# per hostname (platform domain + every tenant custom domain) on first visit, gated
# by the app's /api/internal/tls-check endpoint. See Caddyfile.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../landing-page:/srv/landing:ro   # separate landing repo, cloned OUTSIDE this project (e.g. /opt/landing-page)
      - caddy-data:/data      # cached certs + ACME account (persist this!)
      - caddy-config:/config
    depends_on: [app]
    networks: [web]

  pgbouncer:
    image: bitnami/pgbouncer:1
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: ${DB_USER}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      POSTGRESQL_DATABASE: ${DB_NAME}
      PGBOUNCER_DATABASE: ${DB_NAME}
      PGBOUNCER_POOL_MODE: session
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_MIN_POOL_SIZE: "5"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on: [postgres]
    networks: [web]

  app:
    build: .
    image: cubex-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Route through PgBouncer (session mode — safe with all Prisma transaction forms)
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}"
    depends_on: [postgres, redis, pgbouncer]
    volumes:
      - cubex-uploads:/app/uploads
    networks: [web]
    # No proxy labels needed — Caddy routes by the Caddyfile (reverse_proxy app:3000).

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - cubex-pg:/var/lib/postgresql/data
    networks: [web]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - cubex-redis:/data
    networks: [web]

  adminer:
    image: adminer:latest
    restart: unless-stopped
    networks: [web]   # reachable by Caddy at db.${DOMAIN}

  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    volumes:
      - cubex-uploads:/srv/uploads
      - fb-db:/database
    networks: [web]   # reachable by Caddy at files.${DOMAIN}

volumes:
  caddy-data:
  caddy-config:
  cubex-pg:
  cubex-redis:
  cubex-uploads:
  fb-db:

networks:
  web:
